server:
  port: 8890

spring:
  application:
    name: z-ontology

zont:
  enabled: true
  # 本体 Schema 的本地落盘目录
  storage-path: ~/.zont/ontologies
  default-workspace: default
  # 物化图的 JSONL 持久化文件目录；留空则退回进程内存储（重启丢失）
  graph:
    path: ~/.zont/graph

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.zifang.z.ontology: INFO
